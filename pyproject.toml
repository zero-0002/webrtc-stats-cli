[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webrtc-stats-cli"
version = "0.1.0"
description = "Summarize a WebRTC RTCPeerConnection.getStats() JSON dump from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zero-0002" }]
keywords = ["webrtc", "getstats", "rtc", "diagnostics", "cli"]

[project.scripts]
webrtc-stats = "webrtc_stats_cli.__main__:main"

[tool.setuptools]
packages = ["webrtc_stats_cli"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
